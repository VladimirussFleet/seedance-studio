<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Seedance Studio</title><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<style>
:root { --bg: #16171a; --panel: #1e2024; --panel2: #25282d; --line: #33363c; --text: #e6e7ea; --dim: #9a9ea6; --acc: #ff6a3d; --acc2: #4da3ff; --key: #ffcc00; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; user-select: none; }
button, select, input { font: inherit; color: var(--text); }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: #555a62; } button.on { background: #3a2a24; border-color: var(--acc); color: #ffd7c9; }
button.primary { background: var(--acc); border-color: var(--acc); color: #1a0f0b; font-weight: 600; }
button.small { padding: 2px 7px; font-size: 12px; }
select, input[type=text], input[type=number] { background: #121316; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; min-width: 0; }
input[type=number] { width: 64px; } input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
input[type=range] { accent-color: var(--acc); }
#app { display: grid; grid-template-rows: 46px 1fr 190px; grid-template-columns: 210px 1fr 290px; height: 100vh; }
#top { grid-column: 1 / 4; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
#top .brand { font-weight: 700; letter-spacing: .2px; margin-right: 6px; } #top .brand b { color: var(--acc); }
#top .sp { flex: 1; } #status { color: var(--dim); min-width: 120px; text-align: right; }
#left, #right { background: var(--panel); overflow-y: auto; padding: 10px; }
#left { border-right: 1px solid var(--line); } #right { border-left: 1px solid var(--line); }
h4 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); } h4:first-child { margin-top: 0; }
.addgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; } .addgrid button { padding: 6px 4px; }
#objlist .it { display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
#objlist .it:hover { background: var(--panel2); } #objlist .it.sel { background: #3a2a24; }
#objlist .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; } #objlist .av { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex: none; }
#objlist .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #objlist .tag { color: var(--key); font-size: 11px; }
#view { position: relative; overflow: hidden; background: #0d0e10; }
#vp { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { position: absolute; pointer-events: none; object-fit: fill; display: none; }
#pipframe { position: absolute; border: 2px solid var(--acc); pointer-events: none; border-radius: 3px; }
#pipframe span { position: absolute; left: 0; top: -20px; font-size: 11px; background: var(--acc); color: #1a0f0b; padding: 1px 6px; border-radius: 3px 3px 0 0; font-weight: 600; white-space: nowrap; }
#vbar { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; align-items: center; background: rgba(22,23,26,.85); padding: 5px; border-radius: 8px; border: 1px solid var(--line); }
#hint { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 34% - 40px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); font-size: 11.5px; background: rgba(22,23,26,.7); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
#right .row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 6px; margin: 5px 0; }
#right .att { border-left: 2px solid #ff9f0a55; padding-left: 8px; margin: 6px 0 10px; } #right .row > label { color: var(--dim); } #right .vec { display: flex; gap: 4px; } #right .vec input { width: 100%; }
#right .btns { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.keys { width: 100%; border-collapse: collapse; margin-top: 4px; } .keys td { padding: 2px 2px; } .keys tr.cur td { background: #3a3320; }
.keys input[type=number] { width: 58px; } .keys select { width: 100%; }
.thumb { width: 100%; max-height: 150px; object-fit: contain; border-radius: 6px; background: #000; display: block; margin: 4px 0; }
.muted { color: var(--dim); font-size: 12px; }
#tl { grid-column: 1 / 4; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
#tlbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
#tc { font-variant-numeric: tabular-nums; min-width: 110px; }
#tracks { position: relative; flex: 1; margin: 0 10px 8px 130px; }
.trk { position: relative; height: 28px; border-bottom: 1px solid var(--line); }
.trk .lbl { position: absolute; left: -122px; width: 116px; top: 6px; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ruler { height: 24px; cursor: ew-resize; } #ruler .tick { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--line); color: var(--dim); font-size: 10.5px; padding-left: 3px; }
.shot { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; background: #2b3442; border: 1px solid #3c4a5e; padding: 3px 7px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; cursor: pointer; }
.shot:nth-child(even) { background: #34303f; border-color: #4a4460; } .shot.sel { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.dia { position: absolute; top: 8px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: var(--key); border: 1px solid #000; cursor: grab; border-radius: 2px; }
.dia.cam { background: var(--acc2); } .dia.cur { outline: 2px solid #fff; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--acc); pointer-events: none; z-index: 3; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 380px; max-width: 560px; }
#modal .box h3 { margin: 0 0 10px; } #modal .bar { height: 8px; background: #000; border-radius: 4px; overflow: hidden; margin: 12px 0; } #modal .bar i { display: block; height: 100%; background: var(--acc); width: 0; }
#toast { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); background: #2b2d33; border: 1px solid var(--line); padding: 7px 14px; border-radius: 8px; display: none; z-index: 60; }
</style>
</head><body>
<div id="app">
  <div id="top">
    <div class="brand">Seedance <b>Studio</b></div>
    <select id="projSel" title="Проект"></select>
    <button id="newProj">+ Новая сцена</button>
    <select id="fmt" title="Формат кадра"><option value="h">16:9 · 1280×720</option><option value="v">9:16 · 720×1280</option></select>
    <label class="muted">Длина <input id="dur" type="number" min="1" max="30" step="0.5"> с</label>
    <button id="undo" title="Отменить (Cmd+Z)">↶</button><button id="redo" title="Повторить (Shift+Cmd+Z)">↷</button>
    <div class="sp"></div>
    <label class="muted"><input id="recShot" type="checkbox"> только выбранный план</label>
    <button id="recLab">⏺ С подписями</button>
    <button id="recClean" class="primary">⏺ Записать для Seedance</button>
    <div id="status">…</div>
  </div>

  <div id="left">
    <h4>Добавить</h4>
    <div class="addgrid">
      <button data-add="person">🧍 Человек</button><button data-add="car">🚗 Машина</button>
      <button data-add="box">⬛ Куб</button><button data-add="wall">▮ Стена</button>
      <button data-add="plane">▭ Плита/пол</button><button data-add="cyl">⬤ Цилиндр</button>
      <button data-add="sphere">● Шар</button><button data-add="cone">▲ Конус</button>
      <button data-add="capsule">💊 Капсула</button><button data-add="boat">⛵ Катер</button>
      <button data-add="glb">📦 3D-модель</button>
    </div>
    <h4>Объекты сцены</h4>
    <div id="objlist"></div>
  </div>

  <div id="view">
    <canvas id="vp"></canvas>
    <img id="overlay" alt="">
    <div id="pipframe"><span>Камера</span></div>
    <div id="vbar">
      <button id="vmode" title="C">🎥 Смотреть через камеру</button>
      <button id="tMove" class="on" title="W">↔ Двигать</button><button id="tRot" title="E">⟳ Вращать</button>
      <button id="autokey" class="on" title="Сдвиг объекта во времени сам ставит ключ">◆ Авто-ключ</button>
      <label class="muted">Объектив <input id="dlens" type="range" min="14" max="135" step="1" style="width:90px"> <span id="dlensv"></span></label>
    </div>
    <div id="hint">ЛКМ — выбрать · ПКМ — вращать вид · колесо — зум · F — к объекту · Shift+A — вся сцена · K — ключ · C — камера</div>
  </div>

  <div id="right"></div>

  <div id="tl">
    <div id="tlbar">
      <button id="play" title="Space">▶</button><button id="prevF" class="small">◀︎ кадр</button><button id="nextF" class="small">кадр ▶︎</button>
      <span id="tc"></span>
      <button id="keyObj" title="K, когда выбран объект">◆ Ключ объекта</button>
      <button id="keyCam" title="K, когда выбран план">📷 Ключ камеры из вида</button>
      <button id="grabCam">👁 Взять вид камеры</button>
      <button id="split">✂ Разрезать план здесь</button>
      <div style="flex:1"></div><span class="muted" id="tlhint">◆ жёлтые — ключи объекта, ◆ синие — ключи камеры. Ключи можно перетаскивать.</span>
    </div>
    <div id="tracks">
      <div id="ruler" class="trk"><div class="lbl">Время</div></div>
      <div id="shotsTrk" class="trk"><div class="lbl">Планы</div></div>
      <div id="camTrk" class="trk"><div class="lbl">Камера</div></div>
      <div id="objTrk" class="trk"><div class="lbl" id="objTrkLbl">Объект</div></div>
      <div id="playhead"></div>
    </div>
  </div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="filePick" style="display:none">
<script type="module" src="./app.js"></script>
</body></html>
